name: iOS CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode versions:"
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            LATEST="$(ls -d /Applications/Xcode*.app | sort | tail -n 1)"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build Release iphoneos (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project NeoSerf.xcodeproj \
            -scheme NeoSerf \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

      - name: Package IPA
        id: ipa
        run: |
          set -euo pipefail
          chmod +x ios/scripts/package_ipa.sh
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IPA_LABEL="${GITHUB_REF_NAME}"
          else
            VERSION="1.3.3"
            IPA_LABEL="1.3.3"
          fi
          DERIVED_DATA_PATH="$GITHUB_WORKSPACE/ios/build" ios/scripts/package_ipa.sh "$IPA_LABEL"
          IPA_PATH="$(ls -1 ios/dist/NeoSerf-*.ipa | head -n 1)"
          echo "ipa_path=${IPA_PATH}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$(basename "$IPA_PATH")" >> "$GITHUB_OUTPUT"

      - name: Capture iOS Simulator screenshots
        env:
          SCREENSHOT_OUTPUT: ${{ github.workspace }}/docs/ios-screenshots
        run: |
          set -euo pipefail
          chmod +x ios/scripts/capture_screenshots.sh
          ios/scripts/capture_screenshots.sh

      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: |
            docs/ios-screenshots/
            ios/build-screenshots/NeoSerfUITests.xcresult
          if-no-files-found: error

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoSerf-ipa
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA: ${{ steps.ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail
          # Android and Desktop CI publish the same tag; whichever job finishes first creates the release.
          gh release upload "${GITHUB_REF_NAME}" "$IPA" --clobber ||
            gh release create "${GITHUB_REF_NAME}" "$IPA" --title "NeoSerf ${GITHUB_REF_NAME}" --generate-notes ||
            gh release upload "${GITHUB_REF_NAME}" "$IPA" --clobber
