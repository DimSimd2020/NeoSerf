name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows Qt browser
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
          archives: 'qtbase qtdeclarative qtsvg qttools qttranslations'
          cache: true
      - name: Build, test and package
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: ./desktop/build.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NeoSerf-Windows-x64
          path: desktop/dist/NeoSerf/
          if-no-files-found: error
